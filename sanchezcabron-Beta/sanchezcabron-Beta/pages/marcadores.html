<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcadores - SanchezCabron OS</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">Bookmarks</div>
            <button class="mobile-menu-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
            <nav class="nav">
                <a href="../index.html">Inicio</a>
                <div class="dropdown">
                    <button class="dropbtn">Entretenimiento <i class="fa-solid fa-caret-down fa-xs"></i></button>
                    <div class="dropdown-content">
                        <a href="series.html">Series & Anime</a>
                        <a href="juegos.html">Videojuegos</a>
                        <a href="playlist.html">Playlist</a>
                    </div>
                </div>
                <div class="dropdown">
                    <button class="dropbtn">Personal <i class="fa-solid fa-caret-down fa-xs"></i></button>
                    <div class="dropdown-content">
                        <a href="historias.html">Historias</a>
                        <a href="logros.html">Logros</a>
                        <a href="perfil.html">Perfil</a>
                    </div>
                </div>
                <a href="marcadores.html" class="active" >Links</a>
                <a href="vault.html" title="Acceso Privado"><i class="fa-solid fa-lock"></i></a>
            </nav>
        </div>
    </header>
    <!-- Añadimos position: relative para que las decoraciones se anclen a este contenedor -->
    <main class="container section" style="position: relative;">
        <!-- Elementos Decorativos de Fondo -->
        <img src="../assets/img/decoracion/circuito1.png" id="decoracion-izq" alt="Personaje Izquierda">
        <img src="../assets/img/decoracion/circuito2.png" id="decoracion-der" alt="Personaje Derecha">

        <div class="bookmarks-toolbar">
            <button class="btn btn-secondary filter-btn active" data-category="all">Todos</button>
            <button class="btn btn-secondary filter-btn" data-category="Trabajo">Trabajo</button>
            <button class="btn btn-secondary filter-btn" data-category="Social">Social</button>
            <button class="btn btn-secondary filter-btn" data-category="Entretenimiento">Entretenimiento</button>
            <button class="btn btn-secondary filter-btn" data-category="Otros">Otros</button>
        </div>

        <div id="bookmarksGrid" class="bookmarks-grid">
            <!-- Se llena con JS -->
        </div>

        <!-- Botón Flotante -->
        <button id="addBookmarkBtn" class="floating-btn" title="Añadir Marcador">
            <i class="fa-solid fa-plus"></i>
        </button>

        <!-- Modal Añadir -->
        <div id="bookmarkModal" class="modal-overlay" style="display: none;">
            <div class="modal-content form-container" style="max-width: 500px;">
                <button id="closeBookmarkModal" class="close-modal-btn">&times;</button>
                <h2>Nuevo Marcador</h2>
                <form id="bookmarkForm">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" id="bmName" class="terminal-input" required placeholder="Ej: YouTube">
                    </div>
                    <div class="form-group">
                        <label>URL</label>
                        <input type="url" id="bmUrl" class="terminal-input" required placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label>Categoría</label>
                        <select id="bmCategory" class="terminal-input">
                            <option value="Trabajo">Trabajo</option>
                            <option value="Social">Social</option>
                            <option value="Entretenimiento">Entretenimiento</option>
                            <option value="Otros">Otros</option>
                        </select>
                    </div>
                    <button type="submit" class="btn" style="width: 100%;">Guardar</button>
                </form>
            </div>
        </div>

        <span id="digit-3" style="display:none">8</span>
    </main>
    <script src="../js/logros.js"></script>
    <script>
        function toggleMenu() {
            document.querySelector('.nav').classList.toggle('active');
        }

        // --- Dropdown Menu Logic (Fix Hover Gap) ---
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.dropdown').forEach(dropdown => {
                let hideTimeout;
                const content = dropdown.querySelector('.dropdown-content');

                dropdown.addEventListener('mouseenter', () => {
                    clearTimeout(hideTimeout);
                    document.querySelectorAll('.dropdown-content.show').forEach(openDropdown => {
                        if (openDropdown !== content) {
                            openDropdown.classList.remove('show');
                            openDropdown.parentElement.classList.remove('active');
                        }
                    });
                    content.classList.add('show');
                    dropdown.classList.add('active');
                });

                dropdown.addEventListener('mouseleave', () => {
                    hideTimeout = setTimeout(() => {
                        content.classList.remove('show');
                        dropdown.classList.remove('active');
                    }, 200);
                });
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.dropdown')) {
                    document.querySelectorAll('.dropdown-content.show').forEach(openDropdown => {
                        openDropdown.classList.remove('show');
                        openDropdown.parentElement.classList.remove('active');
                    });
                }
            });
        });
    </script>
    <script src="../js/marcadores.js"></script>
</body>
</html>
