<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Series - SanchezCabron OS</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">Series Manager</div>
            <button class="mobile-menu-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
            <nav class="nav">
                <a href="../index.html">Inicio</a>
                <div class="dropdown">
                    <button class="dropbtn active">Entretenimiento <i class="fa-solid fa-caret-down fa-xs"></i></button>
                    <div class="dropdown-content">
                        <a href="series.html">Series & Anime</a>
                        <a href="juegos.html">Videojuegos</a>
                        <a href="playlist.html">Playlist</a>
                    </div>
                </div>
                <div class="dropdown">
                    <button class="dropbtn">Personal <i class="fa-solid fa-caret-down fa-xs"></i></button>
                    <div class="dropdown-content">
                        <a href="historias.html">Historias</a>
                        <a href="logros.html">Logros</a>
                        <a href="perfil.html">Perfil</a>
                    </div>
                </div>
                <a href="marcadores.html">Links</a>
                <a href="vault.html" title="Acceso Privado"><i class="fa-solid fa-lock"></i></a>
            </nav>
        </div>
    </header>

    <main class="container section">
        <!-- Sub-navegación interna del módulo -->
        <div style="margin-bottom: 2rem; display: flex; gap: 1rem;">
            <button class="btn" onclick="app.navigate('list')"><i class="fa-solid fa-list"></i> Ver Lista</button>
            <button class="btn btn-secondary" onclick="app.navigate('add')"><i class="fa-solid fa-plus"></i> Añadir Nueva</button>
            <button class="btn btn-secondary" onclick="app.exportData()"><i class="fa-solid fa-file-export"></i> Exportar</button>
            <button class="btn btn-secondary" onclick="app.triggerImport()"><i class="fa-solid fa-file-import"></i> Importar</button>
            <input type="file" id="importFile" style="display:none" accept=".json" onchange="app.handleImport(event)">
        </div>

        <!-- VISTA 1: Listado -->
        <div id="view-list" class="view-container">
            <div class="header-actions">
                <h2>Mi Colección</h2>
                <span id="total-counter" class="highlight">0 series</span>
                <span id="total-hours" class="highlight" style="margin-left: 1rem; font-size: 0.9rem;">0h Estimadas</span>
                <div id="statusCounters" class="status-counters"></div>
            </div>
            <div id="seriesGrid" class="series-grid"></div>
        </div>

        <!-- VISTA 2: Formulario -->
        <div id="view-add" class="view-container" style="display: none;">
            <div class="form-container">
                <h2>Nueva Serie</h2>
                <form id="addSeriesForm">
                    <div class="form-group">
                        <label>Título</label>
                        <input type="text" id="titleInput" class="terminal-input" required placeholder="Ej: Breaking Bad">
                    </div>

                    <div class="form-group">
                        <label>Sinopsis</label>
                        <textarea id="synopsisInput" class="terminal-input" rows="3" placeholder="Breve resumen de la trama..."></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Año de Salida</label>
                            <input type="number" id="yearInput" class="terminal-input" placeholder="Ej: 2008">
                        </div>
                        <div class="form-group">
                            <label>Puntuación (0-10)</label>
                            <input type="number" id="ratingInput" class="terminal-input" min="0" max="10" step="0.1" placeholder="Ej: 9.5">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Capítulos</label>
                            <input type="number" id="capsInput" class="terminal-input" required min="1">
                        </div>
                        <div class="form-group">
                            <label>Duración (min)</label>
                            <input type="number" id="durationInput" class="terminal-input" required min="1">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Nombre de Archivo (Opcional)</label>
                        <input type="text" id="fileNameInput" class="terminal-input" placeholder="Ej: edicion_especial.png">
                        <small style="color: #666; font-size: 0.85rem; display: block; margin-top: 0.5rem;">
                            ℹ️ Vacío = <code>img/portadas/titulo.jpg</code>
                        </small>
                    </div>

                    <div class="form-group">
                        <label>Estado Inicial</label>
                        <select id="statusInput" class="terminal-input">
                            <option value="pendiente" selected>📋 Pendiente</option>
                            <option value="viendo">👀 Viendo</option>
                            <option value="simulcast">📡 Simulcast</option>
                            <option value="visto">✅ Visto</option>
                            <option value="abandonado">❌ Abandonado</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn">Guardar Serie</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>Persistencia Local Activa</p>
        </div>
    </footer>

    <!-- Modal de Detalles -->
    <div id="detailsModal" class="modal-overlay" style="display: none;" onclick="app.closeDetails(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-modal-btn" onclick="app.closeDetails()">&times;</button>
            <div class="modal-body">
                <img id="modalCover" src="" alt="Portada" class="modal-img-large">
                <div class="modal-info">
                    <div class="modal-header-row">
                        <h2 id="modalTitle"></h2>
                        <button id="editBtn" class="btn-icon" onclick="app.toggleEditMode()" title="Editar Información"><i class="fa-solid fa-pencil"></i></button>
                    </div>
                    <div class="modal-meta-row">
                        <span class="meta-badge"><i class="fa-solid fa-calendar-days"></i> <span id="modalYear"></span></span>
                        <span class="meta-badge"><i class="fa-solid fa-star"></i> <span id="modalRating"></span></span>
                    </div>
                    <p id="modalSynopsis" class="modal-text"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Importación -->
    <div id="importModal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-body" style="display: block;"> <!-- Override flex -->
                <h3><i class="fa-solid fa-file-import"></i> Importar Copia de Seguridad</h3>
                <p id="importMsg" style="margin: 1rem 0; color: #ccc;"></p>
                <div id="importPreview" style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 4px; font-size: 0.85rem; color: #aaa; margin-bottom: 1rem; max-height: 150px; overflow-y: auto;"></div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                    <button class="btn btn-secondary" onclick="app.closeImportModal()">Cancelar</button>
                    <button class="btn" style="background: var(--danger);" onclick="app.confirmImport('replace')">Reemplazar Todo</button>
                    <button class="btn" onclick="app.confirmImport('merge')">Combinar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="../js/logros.js"></script>
    <script>
        function toggleMenu() {
            document.querySelector('.nav').classList.toggle('active');
        }

        // --- Dropdown Menu Logic (Fix Hover Gap) ---
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.dropdown').forEach(dropdown => {
                let hideTimeout;
                const content = dropdown.querySelector('.dropdown-content');

                dropdown.addEventListener('mouseenter', () => {
                    clearTimeout(hideTimeout);
                    document.querySelectorAll('.dropdown-content.show').forEach(openDropdown => {
                        if (openDropdown !== content) {
                            openDropdown.classList.remove('show');
                            openDropdown.parentElement.classList.remove('active');
                        }
                    });
                    content.classList.add('show');
                    dropdown.classList.add('active');
                });

                dropdown.addEventListener('mouseleave', () => {
                    hideTimeout = setTimeout(() => {
                        content.classList.remove('show');
                        dropdown.classList.remove('active');
                    }, 200);
                });
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.dropdown')) {
                    document.querySelectorAll('.dropdown-content.show').forEach(openDropdown => {
                        openDropdown.classList.remove('show');
                        openDropdown.parentElement.classList.remove('active');
                    });
                }
            });
        });
    </script>
    <script src="../js/script.js"></script>
</body>
</html>
